<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Elegex Phase 2 Audit</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .slide-container {
        width: 1280px;
        min-height: 720px;
        background: #ffffff;
        color: #000000;
        display: grid;
        grid-template-columns: 430px 1fr;
        font-family: Arial, Helvetica, sans-serif;
      }
      .left {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 66px 38px 58px 70px;
      }
      .kicker {
        color: #ea580c;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      h1 {
        font-size: 72px;
        line-height: 0.91;
        font-weight: 800;
        letter-spacing: -4px;
      }
      .meta {
        border-top: 4px solid #000000;
        padding-top: 16px;
        font-size: 17px;
        line-height: 1.45;
        color: #404040;
      }
      .right {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 70px 75px 65px 60px;
        background: linear-gradient(
          135deg,
          #ffffff 0%,
          #ffffff 52%,
          #ea580c 52%,
          #ea580c 100%
        );
      }
      .right-content {
        max-width: 520px;
        border-top: 4px solid #000000;
        padding-top: 22px;
      }
      .subtitle {
        font-size: 30px;
        line-height: 1.2;
        font-weight: 400;
        color: #000000;
      }
      .statement {
        margin-top: 38px;
        font-size: 18px;
        font-weight: 700;
        line-height: 1.35;
        max-width: 400px;
      }
    </style>
  </head>
  <body>
    <div class="slide-container">
      <section class="left">
        <div class="kicker">ELEGEX / AUDIT 02</div>
        <h1>PHASE<br />2<br />AUDIT</h1>
        <div class="meta">
          <strong>21 August 2026</strong><br />Ground truth, domain restoration,
          and the offline-first path.
        </div>
      </section>
      <section class="right">
        <div class="right-content">
          <div class="subtitle">
            An evidence-led review of what the field-service product can—and
            cannot—currently prove.
          </div>
          <div class="statement">
            Acceptance follows functional proof, not a rendered route.
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
